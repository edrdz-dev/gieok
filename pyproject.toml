[project]
name = "gieok"
version = "0.1.0"
description = "Ask questions about your own documents, entirely offline."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Eduardo Rodriguez" }]
keywords = ["rag", "llm", "ollama", "chromadb", "cli", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "typer>=0.27",
    "rich>=14.0",
    "ollama>=0.6",
    "chromadb>=1.5",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
]

[project.urls]
Homepage = "https://github.com/edrdz-dev/gieok"
Issues = "https://github.com/edrdz-dev/gieok/issues"

[project.scripts]
gieok = "gieok.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gieok"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "D"]
ignore = [
    "D107",  # __init__ docstring: the class docstring already covers it
    "D203",  # incompatible with D211 (no blank line before class docstring)
    "D213",  # incompatible with D212 (summary on the first line)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["chromadb.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
